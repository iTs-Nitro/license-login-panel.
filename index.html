<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://zezgyksapuwjnaetemrg.supabase.co";

const SUPABASE_KEY = "sb_publishable_Eo9LQhBk01dDruPUhL6IBQ_qliqt__S";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function checkKey(){

    let key = document.getElementById("key").value;


    let { data, error } = await supabaseClient
        .from("licenses")
        .select("*")
        .eq("license_key", key)
        .single();


    if(error || !data){

        document.getElementById("msg").innerHTML =
        "INVALID KEY";

        return;

    }


    let today = new Date();
    let expire = new Date(data.expire_date);


    if(today > expire){

        document.getElementById("msg").innerHTML =
        "LICENSE EXPIRED";

    }

    else{

        document.getElementById("msg").innerHTML =
        "LICENSE VERIFIED";

    }


}

</script>
