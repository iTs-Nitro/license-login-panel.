<!DOCTYPE html>
<html>
<head>
<title>License Login</title>
</head>

<body>

<h1>License Login</h1>

<input id="key" placeholder="Enter License Key">

<button onclick="login()">Login</button>

<p id="msg"></p>

<script>
function login(){

var key = document.getElementById("key").value;

if(key === "NITRO-12345"){
    document.getElementById("msg").innerHTML = "Login Success ✅";
}
else{
    document.getElementById("msg").innerHTML = "Wrong License Key ❌";
}

}
</script>

</body>
</html>
