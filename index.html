<!DOCTYPE html>
<html>
<head>

<title>FPS Access</title>

<style>

body{
    margin:0;
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1542751371-adc38448a05e");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial;
    color:white;
}


.panel{

    width:380px;
    padding:40px;

    background:rgba(10,10,10,.9);

    border:2px solid red;

    border-radius:15px;

    text-align:center;

    box-shadow:0 0 30px red;

}


h1{

color:red;
letter-spacing:4px;

}


input{

width:90%;
padding:15px;

background:#111;
color:white;

border:1px solid red;
border-radius:8px;

}


button{

margin-top:15px;

width:100%;
padding:15px;

background:red;

color:white;

border:none;

border-radius:8px;

font-weight:bold;

cursor:pointer;

}


.loading{

display:none;

margin-top:20px;

}


.bar{

width:100%;
height:10px;

background:#333;

border-radius:10px;

overflow:hidden;

}


.progress{

height:100%;
width:0%;

background:red;

animation:load 3s forwards;

}


@keyframes load{

from{width:0%;}
to{width:100%;}

}


</style>

</head>


<body>


<div class="panel">


<h1>FPS ACCESS</h1>

<p>LICENSE CHECK</p>


<input id="key" placeholder="ENTER KEY">


<button onclick="login()">START</button>


<div class="loading" id="loading">

<p>Initializing System...</p>

<div class="bar">
<div class="progress"></div>
</div>

</div>


<p id="msg"></p>


</div>



<script>

function login(){

let key=document.getElementById("key").value;


if(key=="12345"){

document.getElementById("loading").style.display="block";


setTimeout(()=>{

document.getElementById("msg").innerHTML=
"READY TO LAUNCH ✅";

},3000);


}

else{

document.getElementById("msg").innerHTML=
"INVALID KEY ❌";

}

}

</script>


</body>
</html>
