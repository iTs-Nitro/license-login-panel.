<!DOCTYPE html>
<html>
<head>

<title>License Login</title>

<style>

*{
    box-sizing:border-box;
}

body{

    background:
    linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.85)),
    url("https://images.unsplash.com/photo-1542751371-adc38448a05e");

    background-size:cover;
    background-position:center;

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial;
    color:white;

}


.box{

    background:rgba(20,20,20,0.9);

    width:350px;

    padding:40px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 0 30px black;

}


h1{

    margin-bottom:25px;

}


input{

    width:100%;

    padding:15px;

    border-radius:10px;

    border:none;

    margin-bottom:15px;

    font-size:16px;

}


button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#00ff88;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


button:hover{

    background:#00cc66;

}


#msg{

    margin-top:20px;

    font-size:18px;

}


</style>

</head>


<body>


<div class="box">

<h1>🔐 License Login</h1>


<input id="key" placeholder="Enter License Key">


<button onclick="login()">LOGIN</button>


<p id="msg"></p>


</div>



<script>

function login(){

let key = document.getElementById("key").value;


if(key=="12345"){

document.getElementById("msg").innerHTML="Login Success ✅";

}

else{

document.getElementById("msg").innerHTML="Wrong License Key ❌";

}


}

</script>


</body>
</html>
