<!DOCTYPE html>
<html>
<head>

<title>FPS License Panel</title>

<style>

body{
    margin:0;
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.9)),
    url("https://images.unsplash.com/photo-1560253023-3ec5d502959f");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial;
    color:white;
}


.panel{

    width:360px;
    padding:35px;

    background:rgba(15,15,15,0.9);

    border:2px solid #ff3030;

    border-radius:15px;

    text-align:center;

    box-shadow:0 0 25px #ff3030;

}


h1{

    color:#ff3030;
    letter-spacing:3px;

}


input{

    width:90%;
    padding:14px;

    background:#111;

    color:white;

    border:1px solid #ff3030;

    border-radius:8px;

    margin:15px 0;

}


button{

    width:100%;

    padding:14px;

    background:#ff3030;

    color:white;

    border:none;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;

}


button:hover{

    background:white;
    color:black;

}


#msg{

    margin-top:20px;

}

</style>

</head>


<body>


<div class="panel">

<h1>FPS ACCESS</h1>

<p>LICENSE VERIFICATION</p>


<input id="key" placeholder="ENTER KEY">


<button onclick="login()">ENTER</button>


<p id="msg"></p>


</div>



<script>

function login(){

let key=document.getElementById("key").value;


if(key=="12345"){

document.getElementById("msg").innerHTML="ACCESS GRANTED ✅";

}

else{

document.getElementById("msg").innerHTML="INVALID KEY ❌";

}

}

</script>


</body>
</html>
